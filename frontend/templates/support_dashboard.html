<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель поддержки</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .support-dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: calc(100vh - 60px);
            gap: 0;
        }

        .chats-list {
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .chat-item {
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .chat-item:hover {
            background: #e8e8e8;
        }

        .chat-item.active {
            background: white;
        }

        .chat-item-username {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .chat-item-preview {
            font-size: 0.875rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item-time {
            font-size: 0.75rem;
            color: #999;
        }

        .chat-area {
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-area-header {
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
            background: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        .chat-area-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            background: #fafafa;
        }

        .message {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-start;
        }

        .message.support {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: white;
            color: #333;
        }

        .message.support .message-bubble {
            background: var(--primary-color);
            color: white;
        }

        .message-time {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.25rem;
        }

        .chat-area-input {
            padding: 1rem;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 0.5rem;
        }

        .chat-area-input input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }

        .send-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 20px;
            cursor: pointer;
        }

        .no-chat-selected {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">Demo Components</a>
            <ul class="navbar-menu">
                <li><a href="/">Главная</a></li>
                <li><a href="/auth">Авторизация</a></li>
                <li><a href="/profile">Профиль</a></li>
                <li><a href="/components">Компоненты</a></li>
                <li><a href="/shop">Магазин</a></li>
                <li><a href="/media">Медиа</a></li>
                <li><a href="/common">Общие</a></li>
                <li><span id="userGreeting" style="color: #4CAF50; font-weight: 600;"></span></li>
            </ul>
        </div>
    </nav>

    <div class="support-dashboard">
        <div class="chats-list" id="chatsList">
        </div>

        <div class="chat-area" id="chatArea">
            <div class="no-chat-selected">Выберите чат для начала</div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        let activeChat = null;

        document.addEventListener('DOMContentLoaded', function() {
            checkSupportAccess();
            loadChats();
        });

        function checkSupportAccess() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/auth';
                return;
            }

            fetch('/api/profile/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(response => response.json())
            .then(user => {
                if (user.username !== 'support') {
                    alert('Доступ запрещён. Только для службы поддержки.');
                    setTimeout(() => window.location.href = '/', 2000);
                } else {
                    document.getElementById('userGreeting').textContent = `Добро пожаловать, ${user.username}!`;
                }
            })
            .catch(() => {
                window.location.href = '/auth';
            });
        }

        function loadChats() {
            const chats = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('chat_')) {
                    const username = key.replace('chat_', '');
                    const messages = JSON.parse(localStorage.getItem(key));
                    if (messages.length > 0) {
                        chats.push({
                            username: username,
                            lastMessage: messages[messages.length - 1],
                            messages: messages
                        });
                    }
                }
            }

            chats.sort((a, b) => b.lastMessage.timestamp - a.lastMessage.timestamp);

            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = chats.map(chat => `
                <div class="chat-item" onclick="openChat('${chat.username}')">
                    <div class="chat-item-username">${chat.username}</div>
                    <div class="chat-item-preview">${chat.lastMessage.text}</div>
                    <div class="chat-item-time">${chat.lastMessage.time}</div>
                </div>
            `).join('');
        }

        function openChat(username) {
            activeChat = username;
            const messages = JSON.parse(localStorage.getItem(`chat_${username}`) || '[]');
            
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.chat-item').classList.add('active');

            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = `
                <div class="chat-area-header">${username}</div>
                <div class="chat-area-messages" id="chatMessages">
                    ${messages.map(msg => `
                        <div class="message ${msg.sender}">
                            <div class="message-bubble">${msg.text}</div>
                            <div class="message-time">${msg.time}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="chat-area-input">
                    <input type="text" id="messageInput" placeholder="Напишите ответ..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">Отправить</button>
                </div>
            `;

            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function sendMessage() {
            if (!activeChat) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const messages = JSON.parse(localStorage.getItem(`chat_${activeChat}`) || '[]');
            const message = {
                sender: 'support',
                text: text,
                time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            };

            messages.push(message);
            localStorage.setItem(`chat_${activeChat}`, JSON.stringify(messages));

            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message support';
            messageDiv.innerHTML = `
                <div class="message-bubble">${message.text}</div>
                <div class="message-time">${message.time}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            input.value = '';
            loadChats();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        setInterval(loadChats, 5000);
    </script>
</body>
</html>
