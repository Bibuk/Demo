<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Панель поддержки</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/support.css">
</head>
<body>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">Demo Components</a>
            <ul class="navbar-menu">
                <li><a href="/">Главная</a></li>
                <li><a href="/auth">Авторизация</a></li>
                <li><a href="/profile">Профиль</a></li>
                <li><a href="/components">Компоненты</a></li>
                <li><a href="/shop">Магазин</a></li>
                <li><a href="/media">Медиа</a></li>
                <li><a href="/common">Общие</a></li>
                <li><span id="userGreeting" class="user-greeting"></span></li>
            </ul>
        </div>
    </nav>

    <div class="support-dashboard">
        <div class="sidebar">
            <ul class="sidebar-menu">
                <li class="active" onclick="showSection('chats')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-inline">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Чаты поддержки
                </li>
                <li onclick="showSection('products')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-inline">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    Управление товарами
                </li>
            </ul>
        </div>

        <div class="main-content">
            <div id="chats-section" class="content-section active">
                <div class="dashboard-layout">
                    <div class="chats-list" id="chatsList" class="bordered-panel scrollable">
                    </div>

                    <div class="chat-area" id="chatArea" class="bordered-panel">
                        <div class="no-chat-selected">Выберите чат для начала</div>
                    </div>
                </div>
            </div>

            <div id="products-section" class="content-section">
                <div class="products-management">
                    <h2>Управление товарами</h2>
                    
                    <div id="addProductForm" class="form-panel hidden">
                        <h3>Добавить новый товар</h3>
                        <form class="product-form" onsubmit="createProduct(event)">
                            <div class="form-group">
                                <label>Название товара</label>
                                <input type="text" id="productName" required>
                            </div>
                            <div class="form-group">
                                <label>Цена (₽)</label>
                                <input type="number" id="productPrice" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label>Описание</label>
                                <textarea id="productDescription" rows="3" required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Изображение (иконка)</label>
                                <select id="productImage" required>
                                    <option value="mobile">Смартфон</option>
                                    <option value="laptop">Ноутбук</option>
                                    <option value="headphones">Наушники</option>
                                    <option value="watch">Часы</option>
                                    <option value="camera">Камера</option>
                                    <option value="mouse">Мышь</option>
                                    <option value="keyboard">Клавиатура</option>
                                    <option value="tablet">Планшет</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Категория</label>
                                <input type="text" id="productCategory" required>
                            </div>
                            <div class="flex-gap-1">
                                <button type="submit" class="btn btn-primary">Создать товар</button>
                                <button type="button" class="btn" onclick="toggleAddForm()">Отмена</button>
                            </div>
                        </form>
                    </div>

                    <button class="btn btn-primary" onclick="toggleAddForm()" class="mb-1-5">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-inline-sm">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Добавить товар
                    </button>

                    <div class="products-list" id="productsList">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Редактировать товар</h3>
                <button class="close-modal" onclick="closeEditModal()">×</button>
            </div>
            <form class="product-form" onsubmit="updateProduct(event)">
                <input type="hidden" id="editProductId">
                <div class="form-group">
                    <label>Название товара</label>
                    <input type="text" id="editProductName" required>
                </div>
                <div class="form-group">
                    <label>Цена (₽)</label>
                    <input type="number" id="editProductPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="editProductDescription" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <input type="text" id="editProductCategory" required>
                </div>
                <div class="form-group">
                    <label>Изображение (иконка)</label>
                    <select id="editProductImage" required>
                        <option value="mobile">Смартфон</option>
                        <option value="laptop">Ноутбук</option>
                        <option value="headphones">Наушники</option>
                        <option value="watch">Часы</option>
                        <option value="camera">Камера</option>
                        <option value="mouse">Мышь</option>
                        <option value="keyboard">Клавиатура</option>
                        <option value="tablet">Планшет</option>
                    </select>
                </div>
                <div class="flex-gap-1">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <button type="button" class="btn" onclick="closeEditModal()">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        let activeChat = null;

        document.addEventListener('DOMContentLoaded', function() {
            checkSupportAccess();
            loadChats();
        });

        function checkSupportAccess() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/auth';
                return;
            }

            fetch('/api/profile/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(response => response.json())
            .then(user => {
                if (user.username !== 'support') {
                    alert('Доступ запрещён. Только для службы поддержки.');
                    setTimeout(() => window.location.href = '/', 2000);
                } else {
                    document.getElementById('userGreeting').textContent = `Добро пожаловать, ${user.username}!`;
                }
            })
            .catch(() => {
                window.location.href = '/auth';
            });
        }

        function loadChats() {
            const chats = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('chat_')) {
                    const username = key.replace('chat_', '');
                    const messages = JSON.parse(localStorage.getItem(key));
                    if (messages.length > 0) {
                        chats.push({
                            username: username,
                            lastMessage: messages[messages.length - 1],
                            messages: messages
                        });
                    }
                }
            }

            chats.sort((a, b) => b.lastMessage.timestamp - a.lastMessage.timestamp);

            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = chats.map(chat => `
                <div class="chat-item" onclick="openChat('${chat.username}')">
                    <div class="chat-item-username">${chat.username}</div>
                    <div class="chat-item-preview">${chat.lastMessage.text}</div>
                    <div class="chat-item-time">${chat.lastMessage.time}</div>
                </div>
            `).join('');
        }

        function openChat(username) {
            activeChat = username;
            const messages = JSON.parse(localStorage.getItem(`chat_${username}`) || '[]');
            
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.chat-item').classList.add('active');

            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = `
                <div class="chat-area-header">${username}</div>
                <div class="chat-area-messages" id="chatMessages">
                    ${messages.map(msg => `
                        <div class="message ${msg.sender}">
                            <div class="message-bubble">${msg.text}</div>
                            <div class="message-time">${msg.time}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="chat-area-input">
                    <input type="text" id="messageInput" placeholder="Напишите ответ..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">Отправить</button>
                </div>
            `;

            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function sendMessage() {
            if (!activeChat) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const messages = JSON.parse(localStorage.getItem(`chat_${activeChat}`) || '[]');
            const message = {
                sender: 'support',
                text: text,
                time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            };

            messages.push(message);
            localStorage.setItem(`chat_${activeChat}`, JSON.stringify(messages));

            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message support';
            messageDiv.innerHTML = `
                <div class="message-bubble">${message.text}</div>
                <div class="message-time">${message.time}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            input.value = '';
            loadChats();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        setInterval(loadChats, 5000);
        function showSection(section) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
            
            if (section === 'chats') {
                document.getElementById('chats-section').classList.add('active');
                event.target.classList.add('active');
            } else if (section === 'products') {
                document.getElementById('products-section').classList.add('active');
                event.target.classList.add('active');
                loadProducts();
            }
        }
        function toggleAddForm() {
            const form = document.getElementById('addProductForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function loadProducts() {
            try {
                const response = await fetch('/api/shop/products');
                const data = await response.json();
                
                if (data.success) {
                    displayProducts(data.products);
                }
            } catch (error) {
                alert('Ошибка загрузки товаров: ' + error.message);
            }
        }

        function displayProducts(products) {
            const productsList = document.getElementById('productsList');
            productsList.innerHTML = products.map(product => {
                let discountPercent = 0;
                if (product.old_price) {
                    discountPercent = Math.round(((product.old_price - product.price) / product.old_price) * 100);
                }
                
                return `
                    <div class="product-item" id="product-${product.id}">
                        <div class="product-item-info">
                            <div class="product-item-name">
                                ${product.name}
                                ${product.old_price ? `<span class="discount-badge">-${discountPercent}%</span>` : ''}
                            </div>
                            <div class="product-item-price">
                                ${product.price} ₽
                                ${product.old_price ? `<span class="old-price">${product.old_price} ₽</span>` : ''}
                            </div>
                            <div class="product-meta">
                                ${product.category} • ${product.description}
                            </div>
                        </div>
                        <div class="product-item-actions">
                            ${!product.old_price ? `
                                <input type="number" class="discount-input" id="discount-${product.id}" placeholder="%" min="0" max="100">
                                <button class="btn btn-small" onclick="applyDiscount(${product.id})" class="btn-orange">
                                    Применить скидку
                                </button>
                            ` : `
                                <button class="btn btn-small" onclick="removeDiscount(${product.id})" class="btn-gray">
                                    Убрать скидку
                                </button>
                            `}
                            <button class="btn btn-small" onclick="editProduct(${product.id})" class="btn-primary-bg">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-inline-sm">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                                Изменить
                            </button>
                            <button class="btn btn-small" onclick="deleteProduct(${product.id})" class="btn-danger-bg">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-inline-sm">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                                Удалить
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function createProduct(event) {
            event.preventDefault();
            
            const productData = {
                name: document.getElementById('productName').value,
                price: parseFloat(document.getElementById('productPrice').value),
                description: document.getElementById('productDescription').value,
                image: document.getElementById('productImage').value,
                category: document.getElementById('productCategory').value
            };

            try {
                const response = await fetch('/api/shop/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(productData)
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✅ Товар успешно создан!', 'success');
                    toggleAddForm();
                    loadProducts();
                    event.target.reset();
                } else {
                    showNotification('❌ Ошибка создания товара: ' + result.detail, 'error');
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        async function applyDiscount(productId) {
            const discountInput = document.getElementById(`discount-${productId}`);
            const discount = parseFloat(discountInput.value);

            if (!discount || discount <= 0 || discount > 100) {
                alert('Введите корректный процент скидки (1-100)');
                return;
            }

            try {
                const response = await fetch(`/api/shop/products/${productId}/discount`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ discount_percent: discount })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✅ ' + result.message, 'success');
                    loadProducts();
                } else {
                    showNotification('❌ Ошибка применения скидки: ' + result.detail, 'error');
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        async function removeDiscount(productId) {
            if (!confirm('Убрать скидку с этого товара?')) return;

            try {
                const response = await fetch(`/api/shop/products/${productId}/discount`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✅ ' + result.message, 'success');
                    loadProducts();
                } else {
                    showNotification('❌ Ошибка удаления скидки: ' + result.detail, 'error');
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        async function editProduct(productId) {
            try {
                const response = await fetch(`/api/shop/products/${productId}`);
                const data = await response.json();
                
                if (data.success) {
                    const product = data.product;
                    document.getElementById('editProductId').value = product.id;
                    document.getElementById('editProductName').value = product.name;
                    document.getElementById('editProductPrice').value = product.price;
                    document.getElementById('editProductDescription').value = product.description;
                    document.getElementById('editProductCategory').value = product.category;
                    document.getElementById('editProductImage').value = product.image;
                    
                    document.getElementById('editModal').classList.add('active');
                }
            } catch (error) {
                alert('Ошибка загрузки данных товара: ' + error.message);
            }
        }
        
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        
        async function updateProduct(event) {
            event.preventDefault();
            
            const productId = document.getElementById('editProductId').value;
            const updateData = {
                name: document.getElementById('editProductName').value,
                price: parseFloat(document.getElementById('editProductPrice').value),
                description: document.getElementById('editProductDescription').value,
                category: document.getElementById('editProductCategory').value,
                image: document.getElementById('editProductImage').value
            };

            try {
                const response = await fetch(`/api/shop/products/${productId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✅ Товар успешно обновлен!', 'success');
                    closeEditModal();
                    loadProducts();
                } else {
                    showNotification('❌ Ошибка обновления товара: ' + result.detail, 'error');
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        async function deleteProduct(productId) {
            if (!confirm('Вы уверены, что хотите удалить этот товар?')) return;

            try {
                const response = await fetch(`/api/shop/products/${productId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✅ Товар успешно удален!', 'success');
                    loadProducts();
                } else {
                    showNotification('❌ Ошибка удаления товара: ' + result.detail, 'error');
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
    </script>
</body>
</html>
